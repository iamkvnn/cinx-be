name: Recommendation Service CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "recommendation/**"
      - ".github/workflows/recommendation-ci.yml"
      - ".github/workflows/recommendation-cd.yml"
jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./recommendation
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cinx-recommendation:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /root/cinx-deployment
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cinx-recommendation:latest
            docker compose up -d --no-deps recommendation
