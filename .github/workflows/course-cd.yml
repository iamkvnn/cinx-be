name: Course Service CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "course/**"
      - "common/**"
      - "pom.xml"
      - ".github/workflows/course-ci.yml"
      - ".github/workflows/course-cd.yml"
jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -pl course -am -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./course
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cinx-course:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /root/cinx-deployment
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cinx-course:latest
            docker compose up -d --no-deps course
