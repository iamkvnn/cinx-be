name: User Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "user/**"
      - "common/**"
      - "pom.xml"
      - ".github/workflows/user-ci-cd.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "user/**"
      - "common/**"
      - "pom.xml"
      - ".github/workflows/user-ci-cd.yml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -pl user -am -DskipTests
  cd:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./user
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cinx-user:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /root/cinx-deployment
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cinx-user:latest
            docker compose up -d --no-deps user
