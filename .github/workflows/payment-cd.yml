name: Payment Service CD

on:
  workflow_run:
    workflows: ["Payment Service CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -e
            cd /root/cinx-deployment
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cinx-payment"
            SHA_TAG="${{ github.event.workflow_run.head_sha }}"
            for attempt in 1 2 3; do
              if docker pull "$IMAGE:$SHA_TAG"; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 10
            done
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" PAYMENT_IMAGE_TAG="$SHA_TAG" docker compose up -d --no-deps --force-recreate payment
            docker image prune -f
