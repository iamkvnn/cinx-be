name: Recommendation Service CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "recommendation/**"
      - ".github/workflows/recommendation-ci.yml"
      - ".github/workflows/recommendation-cd.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "recommendation/**"
      - ".github/workflows/recommendation-ci.yml"
      - ".github/workflows/recommendation-cd.yml"
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd recommendation
          pip install -r requirements.txt
