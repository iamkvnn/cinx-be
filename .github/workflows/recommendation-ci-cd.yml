name: Recommendation Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "recommendation/**"
      - ".github/workflows/recommendation-ci-cd.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "recommendation/**"
      - ".github/workflows/recommendation-ci-cd.yml"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd recommendation
          pip install -r requirements.txt
  cd:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./recommendation
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cinx-recommendation:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /root/cinx-deployment
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cinx-recommendation:latest
            docker compose up -d --no-deps recommendation
