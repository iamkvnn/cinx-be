spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: lb://user
              predicates:
                - Path=/api/v1/users/**
            - id: course-service
              uri: lb://course
              predicates:
                - Path=/api/v1/courses/**,/api/v1/categories/**


server:
    port: 9090

jwt:
  access:
    secret: mysecretkeygfhfffffffffffffffffffffffffffffffffffffmysecretkeygfhfffffffffffffffffffffffffffffffffffff
    expire: 1