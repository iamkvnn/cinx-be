spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: openapi-auth
            uri: lb://auth
            predicates:
            - Path=/v3/api-docs/auth
            filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs
          - id: openapi-cart
            uri: lb://cart
            predicates:
            - Path=/v3/api-docs/cart
            filters:
            - RewritePath=/v3/api-docs/cart, /v3/api-docs
          - id: openapi-user
            uri: lb://user
            predicates:
            - Path=/v3/api-docs/user
            filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs
          - id: openapi-course
            uri: lb://course
            predicates:
            - Path=/v3/api-docs/course
            filters:
            - RewritePath=/v3/api-docs/course, /v3/api-docs
          - id: openapi-enrollment
            uri: lb://enrollment
            predicates:
            - Path=/v3/api-docs/enrollment
            filters:
            - RewritePath=/v3/api-docs/enrollment, /v3/api-docs
          - id: openapi-payment
            uri: lb://payment
            predicates:
            - Path=/v3/api-docs/payment
            filters:
            - RewritePath=/v3/api-docs/payment, /v3/api-docs
          - id: openapi-learning
            uri: lb://learning
            predicates:
            - Path=/v3/api-docs/learning
            filters:
            - RewritePath=/v3/api-docs/learning, /v3/api-docs
          - id: openapi-notification
            uri: lb://notification
            predicates:
            - Path=/v3/api-docs/notification
            filters:
            - RewritePath=/v3/api-docs/notification, /v3/api-docs
          - id: openapi-social
            uri: lb://social
            predicates:
            - Path=/v3/api-docs/social
            filters:
            - RewritePath=/v3/api-docs/social, /v3/api-docs
          - id: auth-service
            uri: lb://auth
            predicates:
            - Path=/api/v1/auth/**
          - id: cart-service
            uri: lb://cart
            predicates:
            - Path=/api/v1/cart/**
          - id: discovery-service
            uri: lb://discovery
            predicates:
            - Path=/api/v1/discovery/**
          - id: user-service
            uri: lb://user
            predicates:
            - Path=/api/v1/users/**,/api/v1/policies/**
          - id: course-service
            uri: lb://course
            predicates:
            - Path=/api/v1/courses/**,/api/v1/admin/courses/**,/api/v1/admin/instructors/**,/api/v1/categories/**
          - id: enrollment-service
            uri: lb://enrollment
            predicates:
            - Path=/api/v1/enrollments/**, /api/v1/orders/**, /api/v1/vouchers/**,
              /api/v1/statistics/**
          - id: payment-service
            uri: lb://payment
            predicates:
            - Path=/api/v1/payments/**
          - id: learning-service
            uri: lb://learning
            predicates:
            - Path=/api/v1/learning/**, /api/v1/daily-goals/**, /api/v1/certificates/**,
              /api/v1/streaks/**, /api/v1/learning-paths/**
          - id: notification-service
            uri: lb://notification
            predicates:
            - Path=/api/v1/notifications/**
          - id: notification-websocket
            uri: lb:ws://notification
            predicates:
            - Path=/ws/**
          - id: notification-sockjs
            uri: lb://notification
            predicates:
            - Path=/sockjs/**
          - id: social-service
            uri: lb://social
            predicates:
            - Path=/api/v1/wishlist/**, /api/v1/reviews/**, /api/v1/course-qna/**, /api/v1/reports/**
          - id: recommendation-service
            uri: http://${RECOMMENDATION_HOST:localhost}:${RECOMMENDATION_PORT:8090}
            predicates:
            - Path=/api/v1/recommendations/**
server:
  port: 9090
jwt:
  access:
    expire: 1
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
    - name: Auth Service
      url: /v3/api-docs/auth
    - name: Cart Service
      url: /v3/api-docs/cart
    - name: User Service
      url: /v3/api-docs/user
    - name: Course Service
      url: /v3/api-docs/course
    - name: Enrollment Service
      url: /v3/api-docs/enrollment
    - name: Payment Service
      url: /v3/api-docs/payment
    - name: Learning Service
      url: /v3/api-docs/learning
    - name: Notification Service
      url: /v3/api-docs/notification
    - name: Social Service
      url: /v3/api-docs/social
