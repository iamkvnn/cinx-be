services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
    - "3300:3306"
    networks:
    - cinx-network
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
    - .env
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
    - "5672:5672"
    - "15672:15672"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
    - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  eureka-server:
    container_name: eureka-server
    ports:
    - "8761:8761"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-eureka:latest
  discovery-service:
    container_name: discovery-service
    networks:
    - cinx-network
    depends_on:
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-discovery:latest
  gateway:
    container_name: gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
    - "9090:9090"
    networks:
    - cinx-network
    depends_on:
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-gateway:latest
  auth:
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-auth:latest
  cart:
    container_name: cart-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cartdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-cart:latest
  course:
