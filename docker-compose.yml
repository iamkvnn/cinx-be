    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-user:latest
  recommendation:
    container_name: recommendation-service
    ports:
    - "8090:8090"
    environment:
      APP_ENV: prod
      DB_HOST: mysql
      DB_NAME: recommendationdb
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: '5672'
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    networks:
    - cinx-network
    depends_on:
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-recommendation:latest
networks:
  cinx-network:
    driver: bridge
    name: cinx-network

volumes:
  mysql-data:
  rabbitmq-data: