services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
    - "3300:3306"
    networks:
    - cinx-network
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
    - .env
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
    - "5672:5672"
    - "15672:15672"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
    - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
    - "3100:3100"
    networks:
    - cinx-network
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    user: root
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      ENVIRONMENT: ${APP_ENV:-prod}
    networks:
    - cinx-network
    depends_on:
    - loki
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
  grafana:
    image: grafana/grafana:11.6.15
    container_name: grafana
    ports:
    - "3333:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/gateway.json
    networks:
    - cinx-network
    depends_on:
    - loki
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9091:9090"
    networks:
      - cinx-network
    depends_on:
      - eureka-server
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.0
    container_name: mysqld-exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=root"
    ports:
      - "9104:9104"
    networks:
      - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
  eureka-server:
    container_name: eureka-server
    ports:
    - "8761:8761"
    networks:
    - cinx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-eureka:${EUREKA_IMAGE_TAG:-latest}
  discovery-service:
    container_name: discovery-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-discovery:${DISCOVERY_IMAGE_TAG:-latest}
  gateway:
    container_name: gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
    - "9090:9090"
    networks:
    - cinx-network
    depends_on:
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-gateway:${GATEWAY_IMAGE_TAG:-latest}
  auth:
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-auth:${AUTH_IMAGE_TAG:-latest}
  cart:
    container_name: cart-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cartdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-cart:${CART_IMAGE_TAG:-latest}
  course:
    container_name: course-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coursedb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-course:${COURSE_IMAGE_TAG:-latest}
  enrollment:
    container_name: enrollment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/enrollmentdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-enrollment:${ENROLLMENT_IMAGE_TAG:-latest}
  learning:
    container_name: learning-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/learningdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-learning:${LEARNING_IMAGE_TAG:-latest}
  notification:
    container_name: notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notificationdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-notification:${NOTIFICATION_IMAGE_TAG:-latest}
  payment:
    container_name: payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/paymentdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-payment:${PAYMENT_IMAGE_TAG:-latest}
  social:
    container_name: social-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/socialdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-social:${SOCIAL_IMAGE_TAG:-latest}
  user:
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/userdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
    - cinx-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-user:${USER_IMAGE_TAG:-latest}
  recommendation:
    container_name: recommendation-service
    ports:
    - "8090:8090"
    environment:
      APP_ENV: prod
      DB_HOST: mysql
      DB_NAME: recommendationdb
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      DIGITALOCEAN_MODEL_ACCESS_KEY: ${DIGITALOCEAN_MODEL_ACCESS_KEY}
      DIGITALOCEAN_INFERENCE_BASE_URL: ${DIGITALOCEAN_INFERENCE_BASE_URL}
      DIGITALOCEAN_LLM_MODEL: ${DIGITALOCEAN_LLM_MODEL}
      DIGITALOCEAN_LLM_TIMEOUT_SECONDS: ${DIGITALOCEAN_LLM_TIMEOUT_SECONDS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      LEARNING_SERVICE_BASE_URL: http://learning:8084
      COURSE_SERVICE_BASE_URL: http://course:8081
    networks:
    - cinx-network
    depends_on:
      eureka-server:
        condition: service_started
    env_file:
    - .env
    image: ${DOCKERHUB_USERNAME}/cinx-recommendation:${RECOMMENDATION_IMAGE_TAG:-latest}
networks:
  cinx-network:
    driver: bridge
    name: cinx-network

volumes:
  mysql-data:
  rabbitmq-data:
  loki-data:
  promtail-positions:
  grafana-data:
  prometheus-data:
