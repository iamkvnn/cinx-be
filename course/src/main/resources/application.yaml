spring:
  application:
    name: course
  rabbitmq:
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
jwt:
  access:
    expire: 1
  refresh:
    expire: 7
server:
  port: 8081
