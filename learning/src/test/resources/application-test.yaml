spring:
  datasource:
    url: jdbc:h2:mem:learning-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    discovery:
      enabled: false
  task:
    scheduling:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false

jwt:
  access:
    secret: 0123456789012345678901234567890123456789012345678901234567890123

aws:
  region: us-east-1
  credentials:
    access-key: ""
    secret-key: ""
  s3:
    endpoint: ""
    bucket: test-bucket
    cdn-url: https://cdn.example.test

gateway:
  url: http://localhost
