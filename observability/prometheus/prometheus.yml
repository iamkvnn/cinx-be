global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape microservices dynamically via Eureka Service Discovery
  - job_name: 'eureka-services'
    metrics_path: '/actuator/prometheus'
    eureka_sd_configs:
      - server: 'http://eureka-server:8761/eureka'
    relabel_configs:
      # Exclude EUREKA-SERVER itself from this job, as it's scraped statically
      - source_labels: [__meta_eureka_app_name]
        regex: 'EUREKA'
        action: drop
      # Set application label to lowercase name of the service
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      # Set instance label to the application instance ID
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance

  # Scrape Gateway service (scraped statically to ensure reliability)
  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:9090']
    labels:
      application: 'gateway'

  # Scrape Eureka Server
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']
    labels:
      application: 'eureka'

  # Scrape RabbitMQ built-in Prometheus metrics
  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']
    labels:
      application: 'rabbitmq'

  # Scrape MySQL metrics via mysqld-exporter
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
    labels:
      application: 'mysql'
